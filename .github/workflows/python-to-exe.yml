# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  workflow_dispatch:  # Allows manual triggering of the workflow
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pyperclip requests beautifulsoup4 cryptography pystray pillow

      - name: Build Exec UpcomingEpisodes (Onefile)
        run: pyinstaller --paths=WatchListApp --onefile --windowed --hidden-import=CacheManager --hidden-import=GUIManager --hidden-import=APIClient --hidden-import=WatchlistManager WatchListApp/UpcomingEpisodes.py
      
      - name: Build Exec UpcomingEpisodes
        run: pyinstaller --paths=WatchListApp --windowed --hidden-import=CacheManager --hidden-import=GUIManager --hidden-import=APIClient --hidden-import=WatchlistManager WatchListApp/UpcomingEpisodes.py

      - name: Build Exec MagnetLinker
        run: pyinstaller --paths=MagnetLinker --name=MagnetLinker --icon=MagnetLinker/icon.png --windowed --hidden-import=CacheManager --hidden-import=GUIManager --hidden-import=APIClient MagnetLinker/MagnetApp.py
     
      - name: Upload Build Artifact - UpcomingEpisodes
        uses: actions/upload-artifact@v4.6.2
        with:
          name: UpcomingEpisodes
          path: |
            dist/UpcomingEpisodes.exe
            dist/UpcomingEpisodes

      - name: Upload Build Artifact - MagnetLinker
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MagnetLinker
          path: |
            dist/MagnetLinker
