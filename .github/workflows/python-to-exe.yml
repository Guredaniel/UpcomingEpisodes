# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  workflow_dispatch:  # Allows manual triggering of the workflow
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pyperclip requests beautifulsoup4 cryptography
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build Exec
        run: pyinstaller --onefile UpcomingEpisodes.py
      
      # Upload the .exe as an artifact
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: UpcomingEpisodes
          path: dist/UpcomingEpisodes.exe

